# fly.toml app configuration file generated for card-bot on 2023-06-09T17:40:56+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "card-bot"
primary_region = "arn"
kill_signal = "SIGINT"
# Before stopping, the bot hides every card number it is showing, one
# Telegram request each; Fly waits only as long as that takes
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source="card_bot_data"
  destination="/data"
  # Daily volume snapshots are the database backups
  snapshot_retention=30
