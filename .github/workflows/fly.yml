name: Fly Deploy

on:
  push:
    branches:
      - master

# Deploys run one at a time, in push order, so an older one cannot
# finish after a newer one
concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy app
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit: this step can use the Fly token
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - run: flyctl deploy --remote-only --ha=false
